syntax = "proto3";

package auth;
import "common.proto";
import "google/api/annotations.proto";

option go_package = "github.com/CAATHARSIS/music-service/api/gen/auth;authpb";

service AuthService {
    rpc Register(RegisterRequest) returns (AuthResponse) {
        option (google.api.http) = {
            post: "/v1/auth/register"
            body: "*"
        };
    }
    
    rpc Login(LoginRequest) returns (AuthResponse) {
        option (google.api.http) = {
            post: "/v1/auth/login"
            body: "*"
        };
    }
    
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse) {
        option (google.api.http) = {
            post: "/v1/auth/validate"
            body: "*"
        };
    }
    
    rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse) {
        option (google.api.http) = {
            post: "/v1/auth/refresh"
            body: "*"
        };
    }
    
    rpc GetProfile(GetProfileRequest) returns (UserProfile) {
        option (google.api.http) = {
            get: "/v1/users/{user_id}"
        };
    }
    
    rpc Health(common.Empty) returns (common.HealthyCheckResponse) {
        option (google.api.http) = {
            get: "/v1/auth/health"
        };
    }
}

message User {
    string id = 1;
    string username = 2;
    string email = 3;
    string role = 4;
    string created_at = 5;
    string updated_at = 6;
}

message UserProfile {
    string id = 1;
    string username = 2;
    string email = 3;
    optional string avatar_image_id = 4;
    string created_at = 5;
}

message RegisterRequest {
    string username = 1;
    string email = 2;
    string password = 3;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message AuthResponse {
    string access_token = 1;
    string refresh_token = 2;
    int64 expires_in = 3; // in seconds
    User user = 4;
}

message ValidateTokenRequest {
    string token = 1;
}

message ValidateTokenResponse {
    bool valid = 1;
    string user_id = 2;
    string role = 3;
}

message RefreshTokenRequest {
    string refresh_token = 1;
}

message GetProfileRequest {
    string user_id = 1;
}

// File Service Integration

message GetAvatarURLRequest {
    string avatar_image_id = 1;
}

message AvatarURLResponse {
    string url = 1;
    int64 expires_at = 2;
}