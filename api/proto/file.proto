// Downloading files and streaming
// priority 3

syntax = "proto3";

package file;

import "common.proto";

option go_package = "github.com/CAATHARSIS/music-service/api/gen/file;filepb";

service FileService {
    rpc UploadFile(stream UploadFileRequest) returns (FileInfo);
    rpc GetFileInfo(GetFileInfoRequest) returns (FileInfo);
    rpc GetDownloadURL(GetDownloadURLRequest) returns (DownloadURLResponse);
    rpc DeleteFile(DeleteFileRequest) returns (common.Empty);
    rpc Health(common.Empty) returns (common.HealthyCheckResponse);
}

message FileInfo {
    string id = 1;
    string original_name = 2;
    string bucket = 3;
    string key = 4;
    int64 size = 5;
    string mime_type = 6;
    string uploaded_by = 7;
    string created_at = 8;
}

message UploadFileRequest {
    oneof data {
        FileMetadata metadata = 1;
        bytes chunk = 2;
    }
}

message FileMetadata {
    string original_name = 1;
    string mime_type = 2;
    string uploaded_by = 3;
    string bucket = 4;
}

message GetFileInfoRequest {
    string file_id = 1;
}

message GetDownloadURLRequest {
    string file_id = 1;
    int32 expiry_seconds = 2;
}

message DownloadURLResponse {
    string url = 1;
    int64 expires_at = 2;
}

message DeleteFileRequest {
    string file_id = 1;
}