// playlist generation
// priority 5

syntax = "proto3";

package rules;
import "common.proto";
import "google/api/annotations.proto";

option go_package = "github.com/CAATHARSIS/music-service/api/gen/rules;rulespb";

service RuleService {
    rpc CreateRule(CreateRuleRequest) returns (Rule) {
        option (google.api.http) = {
            post: "/v1/rules"
            body: "*"
        };
    }
    
    rpc GetRule(GetRuleRequest) returns (Rule) {
        option (google.api.http) = {
            get: "/v1/rules/{rule_id}"
        };
    }
    
    rpc ListUserRules(ListUserRulesRequest) returns (ListRulesResponse) {
        option (google.api.http) = {
            get: "/v1/users/{user_id}/rules"
        };
    }
    
    rpc UpdateRule(UpdateRuleRequest) returns (Rule) {
        option (google.api.http) = {
            put: "/v1/rules/{rule_id}"
            body: "*"
        };
    }
    
    rpc DeleteRule(DeleteRuleRequest) returns (common.Empty) {
        option (google.api.http) = {
            delete: "/v1/rules/{rule_id}"
        };
    }
    
    rpc ExecuteRule(ExecuteRuleRequest) returns (ExecuteRuleResponse) {
        option (google.api.http) = {
            post: "/v1/rules/{rule_id}/execute"
            body: "*"
        };
    }
    
    rpc Health(common.Empty) returns (common.HealthyCheckResponse) {
        option (google.api.http) = {
            get: "/v1/rules/health"
        };
    }
}
message RuleCondition {
    repeated string genres = 1;
    optional int32 year_from = 2;
    optional int32 year_to = 3;
    optional int32 min_duration = 4;
    optional int32 max_duration = 5;
    optional int32 min_plays_count = 6;
}

message Rule {
    string id = 1;
    string user_id = 2;
    string name = 3;
    RuleCondition condition = 4;
    int32 limit = 5;
    string cron_schedule = 6;
    bool is_active = 7;
    string last_executed_at = 8;
    string created_at = 9;
    string updated_at = 10;
}

message CreateRuleRequest {
    string user_id = 1;
    string name = 2;
    RuleCondition condition = 3;
    int32 limit = 4;
    string cron_schedule = 5;
}

message GetRuleRequest {
    string rule_id = 1;
}

message ListUserRulesRequest {
    string user_id = 1;
}

message ListRulesResponse {
    repeated Rule rules = 1;
}

message UpdateRuleRequest {
    string rule_id = 1;
    optional string name = 2;
    optional RuleCondition condition = 3;
    optional int32 limit = 4;
    optional string cron_schedule = 5;
    optional bool is_active = 6;
}

message DeleteRuleRequest {
    string rule_id = 1;
}

message ExecuteRuleRequest {
    string rule_id = 1;
}

message ExecuteRuleResponse {
    string playlist_id = 1;
    int32 track_count = 2;
}